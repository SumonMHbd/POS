name: Deploy MHS POS to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages-deploy'
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production static bundle
        run: npm run build

      - name: Prepare SPA 404 fallback and .nojekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish built bundle to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      - name: Configure GitHub Pages (Actions mode)
        id: pages_config
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.pages_config.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages (Actions mode)
        if: steps.pages_config.outcome == 'success'
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4
