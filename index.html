<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MHS POS — Smart Retail & Inventory</title>
    <meta
      name="description"
      content="MHS POS is a Point-of-Sale, inventory management, drag-and-drop analytics, e-commerce order sync, and offline-capable retail dashboard.."
    />
    <meta property="og:title" content="MHS POS — Smart Retail & Inventory" />
    <meta
      property="og:description"
      content="MHS POS is a Point-of-Sale, inventory management, drag-and-drop analytics, e-commerce order sync, and offline-capable retail dashboard."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MHS POS" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link
      rel="preload"
      href="./fonts/solaimanlipi-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./fonts/solaimanlipi-bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-emerald-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      (function () {
        if (!location.hostname.endsWith('.github.io')) return;
        var rawTsxScript = document.querySelector('script[src*="src/main.tsx"]');
        if (!rawTsxScript) return;
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && !root.hasChildNodes()) {
            root.innerHTML =
              '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Roboto,sans-serif;background:#f8fafc;color:#0f172a;">' +
              '<div style="max-width:520px;width:100%;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:28px;box-shadow:0 16px 40px rgba(15,23,42,0.08);">' +
              '<div style="display:inline-block;background:#ecfdf5;color:#047857;font-weight:700;font-size:12px;padding:4px 10px;border-radius:8px;margin-bottom:12px;">MHS POS · GitHub Pages Setup</div>' +
              '<h1 style="margin:0 0 10px;font-size:20px;font-weight:700;">Switch GitHub Pages Source to Compiled Build</h1>' +
              '<p style="margin:0 0 14px;font-size:14px;line-height:1.6;color:#475569;">GitHub Pages is currently serving raw TypeScript source files from the <strong>main</strong> branch. An automated build workflow is included in this repository.</p>' +
              '<ol style="margin:0;padding-left:20px;font-size:14px;line-height:1.7;color:#334155;">' +
              '<li>Open your GitHub repository <strong>Settings → Pages</strong>.</li>' +
              '<li>Under <strong>Build and deployment → Source</strong>, select <strong>GitHub Actions</strong> (or select branch <strong>gh-pages</strong> / <strong>/(root)</strong> after the Action finishes).</li>' +
              '<li>Wait ~1 minute for the Action to turn green, then refresh this page.</li>' +
              '</ol>' +
              '</div></div>';
          }
        }, 1200);
      })();
    </script>
  </body>
</html>
